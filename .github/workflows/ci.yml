name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24"
      - run: go install github.com/google/addlicense@v1.2.0
      - run: scripts/license-headers.sh check

  test:
    name: test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.88.0"
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68
        with:
          tool: nextest
      - run: cargo nextest run --all-targets --all-features --locked
      - name: Doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --doc --all-features --locked

  feature-matrix:
    name: feature ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [core, anthropic, openai, ollama, bedrock, bedrock-mantle, all-providers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
      - name: Check isolated feature
        shell: bash
        run: |
          if [[ "${{ matrix.feature }}" == core ]]; then
            cargo check --all-targets --no-default-features --locked
          else
            cargo check --all-targets --no-default-features --features "${{ matrix.feature }}" --locked
          fi
      - name: Assert core dependency boundary
        if: ${{ matrix.feature == 'core' }}
        shell: bash
        run: |
          tree=$(cargo tree --no-default-features --locked --edges normal,build)
          if grep -E '(^| )(aws-|reqwest |moka )' <<<"$tree"; then
            echo "provider dependency leaked into the core-only graph" >&2
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --no-default-features --locked
          cargo doc --no-deps --all-features --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - run: cargo publish --dry-run --locked
      - name: Verify packaged feature surfaces
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cargo package --locked
          mkdir package-check
          tar -xzf "target/package/modelplease-$version.crate" -C package-check
          manifest="package-check/modelplease-$version/Cargo.toml"
          cargo check --manifest-path "$manifest" --no-default-features
          cargo check --manifest-path "$manifest" --no-default-features --features openai
          cargo check --manifest-path "$manifest" --no-default-features --features bedrock
          cargo check --manifest-path "$manifest" --all-features
          cargo package --list --locked > "$RUNNER_TEMP/modelplease-package-files.txt"
          mv "$RUNNER_TEMP/modelplease-package-files.txt" .
          sha256sum "target/package/modelplease-$version.crate" > modelplease-package.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modelplease-package
          path: |
            target/package/modelplease-*.crate
            modelplease-package-files.txt
            modelplease-package.sha256
